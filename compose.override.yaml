services:
  depth:
    build:
      context: ./depth
      dockerfile: Dockerfile
    image: robot_sensors-depth:2.5.5-stable
    container_name: stereo-depth
    network_mode: host
    ipc: host
    privileged: true
    restart: unless-stopped
    stop_grace_period: 20s

    depends_on:
      camera:
        condition: service_healthy

    environment:
      ROS_DOMAIN_ID: "0"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      FASTRTPS_DEFAULT_PROFILES_FILE: /config/fastdds/udp_only.xml
      FASTDDS_DEFAULT_PROFILES_FILE: /config/fastdds/udp_only.xml
      FASTDDS_BUILTIN_TRANSPORTS: UDPv4

    volumes:
      - /dev:/dev
      - /sys:/sys
      - ./fastdds/udp_only.xml:/config/fastdds/udp_only.xml:ro

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -lc 'source /opt/tros/humble/setup.bash && timeout 8s ros2 topic
          echo --no-daemon --spin-time 2 --once /StereoNetNode/stereonet_depth
          sensor_msgs/msg/Image --field header >/dev/null'
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
