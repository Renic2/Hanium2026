services:
  lidar:
    build:
      context: ./lidar

    image: robot_sensors-lidar:1.2.1-imu-calibrated

    container_name: rplidar
    restart: unless-stopped
    init: true

    network_mode: host

    environment:
      ROS_DOMAIN_ID: "0"
      RMW_IMPLEMENTATION: "rmw_fastrtps_cpp"
      FASTRTPS_DEFAULT_PROFILES_FILE: "/config/udp_only.xml"
      FASTDDS_DEFAULT_PROFILES_FILE: "/config/udp_only.xml"
      FASTDDS_BUILTIN_TRANSPORTS: "UDPv4"

    volumes:
      - ./fastdds/udp_only.xml:/config/udp_only.xml:ro

    devices:
      - /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0:/dev/rplidar

    healthcheck:
      test:
        - CMD
        - /mapping_healthcheck.sh
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  camera:
    image: robot_sensors-camera:2.4.0-stable

    container_name: stereo-camera
    restart: unless-stopped

    privileged: true
    network_mode: host
    ipc: host

    environment:
      ROS_DOMAIN_ID: "0"
      RMW_IMPLEMENTATION: "rmw_fastrtps_cpp"
      FASTRTPS_DEFAULT_PROFILES_FILE: "/config/udp_only.xml"
      FASTDDS_DEFAULT_PROFILES_FILE: "/config/udp_only.xml"
      FASTDDS_BUILTIN_TRANSPORTS: "UDPv4"

    volumes:
      - ./fastdds/udp_only.xml:/config/udp_only.xml:ro
      - /dev:/dev
      - /sys:/sys
      - /run/udev:/run/udev:ro

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -lc 'source /opt/tros/humble/setup.bash && timeout 8s ros2 topic
          echo --no-daemon --spin-time 2 --once /image_combine_raw
          sensor_msgs/msg/Image --field header >/dev/null'
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 30s

    command:
      - ros2
      - run
      - mipi_cam
      - mipi_cam
      - --ros-args
      - -p
      - device_mode:=dual
      - -p
      - dual_combine:=1
      - -p
      - image_width:=640
      - -p
      - image_height:=352
      - -p
      - framerate:=10.0
      - -p
      - out_format:=nv12
      - -p
      - channel:=2
      - -p
      - channel2:=0
      - -p
      - rotation:=0.0
      - -p
      - cal_rotation:=0.0
      - -p
      - gdc_enable:=false
      - -p
      - lpwm_enable:=true
      - -p
      - frame_ts_type:=sensor
      - -p
      - camera_calibration_file_path:=/opt/tros/humble/lib/mipi_cam/config/SC230ai_dual_calibration.yaml
      - --log-level
      - warn

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  imu:
    build:
      context: ./imu

    image: robot_sensors-imu:1.1.0-calibrated
    container_name: ebimu
    restart: unless-stopped
    init: true
    stop_grace_period: 10s

    network_mode: host

    environment:
      ROS_DOMAIN_ID: "0"
      RMW_IMPLEMENTATION: "rmw_fastrtps_cpp"
      FASTRTPS_DEFAULT_PROFILES_FILE: "/config/udp_only.xml"
      FASTDDS_DEFAULT_PROFILES_FILE: "/config/udp_only.xml"
      FASTDDS_BUILTIN_TRANSPORTS: "UDPv4"

    volumes:
      - ./fastdds/udp_only.xml:/config/udp_only.xml:ro

    devices:
      - /dev/ttyS2:/dev/imu_left

    command:
      - python3
      - /app/ebimu_ros2_node.py
      - --ros-args
      - -p
      - right.enabled:=false
      - -p
      - left.calibration.enabled:=true
      - -p
      - left.calibration.output_frame_id:=base_link
      - -p
      - left.calibration.sample_count:=300
      - -p
      - left.calibration.yaw_deg:=0.0

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -lc 'source /opt/ros/humble/setup.bash && timeout 8s ros2 topic
          echo --no-daemon --spin-time 2 --qos-reliability best_effort --once
          /imu/left/data_calibrated
          sensor_msgs/msg/Imu --field header >/dev/null'
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
